[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myna"
version = "0.1.0"
description = "Local voice-cloning CLI built on Chatterbox TTS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chatterbox-tts",
    "resemblyzer",
    "setuptools<81",
]

[project.scripts]
myna = "myna.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require the real Chatterbox model or network access; run with MYNA_E2E=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myna"]
